name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Writes the real stats endpoint into the deploy artifact only --
      # this file is gitignored and never exists in the repo itself.
      - name: Inject stats-collection endpoint
        run: |
          echo "export const COLLECT_ENDPOINT = \"${{ secrets.COLLECT_ENDPOINT }}\";" > js/collect-config.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
